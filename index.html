<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171716"><title>林佩萱｜品牌作品集</title>
<style>
:root{--bg:#191816;--accent:#c85d50;--cream:#f5f0e8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#484037,#1a1918 75%);color:var(--cream);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3vw,48px)}.brand{font-size:16px;font-weight:700;letter-spacing:.14em}.subtitle{color:#c7bfb5;font-size:12px;margin-top:4px}.action{display:flex;gap:8px;flex-wrap:wrap}button,.action a{font:inherit;color:#f9f6f0;background:#36312e;border:1px solid #776d65;border-radius:8px;padding:9px 13px;text-decoration:none;cursor:pointer}button:hover,.action a:hover{background:#5a4841}button:disabled{opacity:.3;cursor:default}.stage{height:calc(100vh - 166px);min-height:340px;display:flex;align-items:center;justify-content:center;padding:0 28px;perspective:2000px}.book{height:min(100%,760px);aspect-ratio:1.414;max-width:100%;display:flex;position:relative;filter:drop-shadow(0 16px 22px #0008)}.leaf{height:100%;width:50%;background:#ede7df;overflow:hidden;position:relative}.leaf img{width:100%;height:100%;object-fit:contain;display:block}.leaf.left{box-shadow:inset -6px 0 8px #0002}.leaf.right{box-shadow:inset 6px 0 8px #0002}.empty{background:#302d29}.seam{position:absolute;left:50%;height:100%;width:1px;background:#bfb4a3aa;z-index:3;pointer-events:none}.book.single{aspect-ratio:.707}.book.single .leaf{width:100%}.book.single .left,.book.single .seam{display:none}.book.single .right{box-shadow:none}.flip{position:absolute;top:0;height:100%;width:50%;z-index:5;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.55,.3,1);pointer-events:none}.flip.forward{right:0;transform-origin:left center}.flip.backward{left:0;transform-origin:right center}.flip.go.forward{transform:rotateY(-180deg)}.flip.go.backward{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#f5f0e8;overflow:hidden}.face img{width:100%;height:100%;object-fit:contain}.face.back{transform:rotateY(180deg)}.controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 10px 20px}.controls button{font-size:20px;padding:7px 16px}.status{font-size:13px;min-width:185px;text-align:center;color:#eee0d2}.hint{font-size:12px;color:#c3b8ad;text-align:center}.works{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;min-height:30px;margin:4px auto}.works a{color:#f8e7df;font-size:12px;border-bottom:1px solid #d08071;text-decoration:none}.zoom{position:fixed;inset:0;background:#111e;z-index:30;display:none;align-items:center;justify-content:center;padding:35px 15px}.zoom.active{display:flex}.zoom img{max-height:95%;max-width:100%;object-fit:contain}.zoom button{position:absolute;right:15px;top:15px} .leaf img{cursor:zoom-in}@media(max-width:720px){.top{padding:12px}.brand{font-size:14px}.subtitle{font-size:11px}.action a{font-size:12px}.stage{height:calc(100dvh - 195px);padding:0 14px}.book{height:min(100%,730px);aspect-ratio:.707}.book .leaf{width:100%}.book .left,.book .seam{display:none}.book .right{box-shadow:none}.flip{width:100%!important;left:0!important;right:auto!important;transform-origin:left center!important}.controls{padding-bottom:6px}.hint{padding:0 10px 12px}}
</style></head><body>
<header class="top"><div><div class="brand">林佩萱 <span style="color:#d0796a">/</span> 品牌作品集</div><div class="subtitle">A-SIAN MOVING SERVICE × PLAYGROUND · 2026</div></div><div class="action"><a href="Axian_Portfolio_Online_Complete.pdf" download>下載完整 PDF</a><button id="full" title="全螢幕">全螢幕</button></div></header>
<main class="stage"><div class="book" id="book"><div class="leaf left" id="left"></div><div class="leaf right" id="right"></div><div class="seam"></div></div></main>
<div class="works" id="works"></div><div class="controls"><button id="prev" aria-label="上一頁">‹</button><span class="status" id="status"></span><button id="next" aria-label="下一頁">›</button></div><div class="hint">電腦：左右方向鍵翻頁　｜　手機：左右滑動　｜　點擊圖片放大</div><div class="zoom" id="zoom"><button id="close">關閉 ✕</button><img id="zoomimg" alt="放大作品頁"></div>
<script>
const imgs=Array.from({length:30},(_,i)=>`pages/${String(i+1).padStart(2,'0')}.jpg`);
const works={6:[['官方網站','https://axianmove-4v9yfxtr.manus.space/']],7:[['觀看短影音','https://www.youtube.com/shorts/fIlpIyEm9rE']],24:[['開啟點點釣魚','https://diandianfsh-wbebkzev.manus.space/']],25:[['聆聽原創歌曲','https://www.youtube.com/watch?v=wcwqYPX2na8']],26:[['觀看 AI 影音','https://www.youtube.com/watch?v=l-50fiuRfvA']],27:[['觀看短影音','https://www.youtube.com/shorts/fIlpIyEm9rE']],28:[['開啟品牌網站','https://axianmove-4v9yfxtr.manus.space/']]};
const book=document.getElementById('book'),L=document.getElementById('left'),R=document.getElementById('right'),status=document.getElementById('status'),worksBox=document.getElementById('works');let step=0,busy=false;
const spreads=[[null,0],...Array.from({length:14},(_,i)=>[1+i*2,2+i*2]),[29,null]];
const mobile=()=>window.matchMedia('(max-width:720px)').matches;
function face(node,index){node.innerHTML='';node.classList.toggle('empty',index===null);if(index!==null){let img=new Image();img.src=imgs[index];img.alt=`作品集第 ${index+1} 頁`;img.onclick=()=>zoom(index);node.append(img)}}
function state(){if(mobile()){book.classList.add('single');face(R,step);face(L,null);status.textContent=step===0?'封面':step===29?'封底':`內頁 ${step} / 28`;}else{book.classList.remove('single');const [l,r]=spreads[step];face(L,l);face(R,r);status.textContent=step===0?'封面':step===15?'封底':`內頁 ${l}–${r} / 28`;}document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===(mobile()?29:15);let active=mobile()?[step]:spreads[step].filter(x=>x!==null);worksBox.innerHTML='';for(let p of active){for(let [label,url] of (works[p]||[])){let a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='↗ '+label;worksBox.append(a)}}}
function go(dir){let max=mobile()?29:15;if(busy||step+dir<0||step+dir>max)return;busy=true;let old=mobile()?[null,step]:spreads[step];let next=mobile()?[null,step+dir]:spreads[step+dir];if(!mobile()){face(L,next[0]);face(R,next[1]);}let flip=document.createElement('div');flip.className='flip '+(dir>0?'forward':'backward');let front=document.createElement('div'),back=document.createElement('div');front.className='face';back.className='face back';const image=(el,p)=>{if(p!==null){let im=new Image();im.src=imgs[p];el.append(im)}};image(front,dir>0?old[1]:old[0]);image(back,dir>0?next[0]:next[1]);flip.append(front,back);book.append(flip);requestAnimationFrame(()=>requestAnimationFrame(()=>flip.classList.add('go')));setTimeout(()=>{step+=dir;flip.remove();busy=false;state()},640)}
function zoom(i){document.getElementById('zoomimg').src=imgs[i];document.getElementById('zoom').classList.add('active')}
function closeZoom(){document.getElementById('zoom').classList.remove('active')}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('close').onclick=closeZoom;document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')closeZoom()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();if(!document.getElementById('zoom').classList.contains('active')){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)}});let touchX=0;book.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});let wasMobile=mobile();window.addEventListener('resize',()=>{if(wasMobile!==mobile()){step=mobile()?Math.min(29,spreads[step][1]??29):Math.max(0,Math.min(15,Math.ceil(step/2)));wasMobile=mobile();state()}});state();
</script></body></html>
